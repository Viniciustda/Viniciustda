name: Generate snake

on:
  # runs every day at 03:00 UTC (midnight in Brasília)
  schedule:
    - cron: "0 3 * * *"
  # lets you run it by hand in the Actions tab
  workflow_dispatch:
  # runs again when you change the repository
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # draws the snake eating the contribution graph (light and dark versions)
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publishes the images in the "output" branch, used by the README
      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
